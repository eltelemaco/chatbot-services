services:
  barber-backend:
    image: ${DOCKERHUB_REPO:-yourdockerhubuser}/chatbot-barber-backend:latest
    build:
      context: .
      dockerfile: services/barber/backend/Dockerfile
    expose:
      - "3001"
    env_file:
      - ./secrets.conf
    environment:
      PORT: "3001"
      # OpenRouter + Amazon Nova Lite (via Bedrock BYOK) by default — override in .env.
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-amazon/nova-lite-v1}"
      DATABASE_PATH: "/data/appointments.db"
      SHOP_TZ: "America/Mexico_City"
      LLM_MAX_TOKENS: "8000"
      ALLOWED_ORIGINS: "https://${BARBER_DOMAIN:-barber.example.com}"
      PUBLIC_DOMAIN: "${BARBER_DOMAIN:-barber.example.com}"
      NODE_ENV: production
      SERVICE_NAME: "barber"
      APP_LOG_PATH: "/app/logs/app.log"
    volumes:
      - barber-data:/data
      - ./logs/barber-backend:/app/logs
    restart: unless-stopped
    mem_limit: 400m
    mem_reservation: 150m
    cpus: 1.2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  barber-landing:
    image: ${DOCKERHUB_REPO:-yourdockerhubuser}/chatbot-barber-landing:latest
    build:
      context: services/barber/landing
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - barber-backend
    restart: unless-stopped
    mem_limit: 80m
    mem_reservation: 32m
    cpus: 0.4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  restaurant-backend:
    image: ${DOCKERHUB_REPO:-yourdockerhubuser}/chatbot-restaurant-backend:latest
    build:
      context: .
      dockerfile: services/restaurant/backend/Dockerfile
    expose:
      - "3002"
    env_file:
      - ./secrets.conf
    environment:
      PORT: "3002"
      # OpenRouter + Amazon Nova Lite (via Bedrock BYOK) by default — override in .env.
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-amazon/nova-lite-v1}"
      DATABASE_PATH: "/data/reservations.db"
      SHOP_TZ: "America/Mexico_City"
      LLM_MAX_TOKENS: "8000"
      ALLOWED_ORIGINS: "https://${RESTAURANT_DOMAIN:-restaurant.example.com}"
      PUBLIC_DOMAIN: "${RESTAURANT_DOMAIN:-restaurant.example.com}"
      NODE_ENV: production
      SERVICE_NAME: "restaurant"
      APP_LOG_PATH: "/app/logs/app.log"
    volumes:
      - restaurant-data:/data
      - ./logs/restaurant-backend:/app/logs
    restart: unless-stopped
    mem_limit: 300m
    mem_reservation: 120m
    cpus: 0.8
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  restaurant-landing:
    image: ${DOCKERHUB_REPO:-yourdockerhubuser}/chatbot-restaurant-landing:latest
    build:
      context: services/restaurant/landing
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - restaurant-backend
    restart: unless-stopped
    mem_limit: 80m
    mem_reservation: 32m
    cpus: 0.4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      BARBER_DOMAIN: "${BARBER_DOMAIN:-barber.example.com}"
      RESTAURANT_DOMAIN: "${RESTAURANT_DOMAIN:-restaurant.example.com}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ./logs/caddy:/var/log/caddy
    depends_on:
      - barber-backend
      - barber-landing
      - restaurant-backend
      - restaurant-landing
    restart: unless-stopped
    mem_limit: 100m
    mem_reservation: 32m
    cpus: 0.4
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  barber-data:
  restaurant-data:
  caddy-data:
  caddy-config:
